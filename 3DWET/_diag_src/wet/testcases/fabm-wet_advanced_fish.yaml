instances:
  F0:
    long_name: prey fish 0-6 cm
    model: wet/fish
    coupling:
      PLANprey1: copepods
      PLANprey2: cladocerans
      adult_D: F1/sD
      adult_N: F1/sN
      adult_P: F1/sP
      adult_Res: F1/sFRes
      adult_Siz: F1/sDSiz
      DOM_DW_pool_water: DOM/sDW
      DOM_N_pool_water: DOM/sNW
      DOM_P_pool_water: DOM/sPW
      NH4_pool_water: abiotic_water/sNH4W
      PO4_pool_water: abiotic_water/sPO4W
      POM_DW_pool_water: POM/sDW
      POM_N_pool_water: POM/sNW
      POM_P_pool_water: POM/sPW
      bot_pel_conv: bot_pel_interface/bot_pel_conv
      oxygen_pool_water: abiotic_water/sO2W
    initialization:
      sD: 0.01                                       #  DW (gDW/m3)
      sN: 0.001                                      #  N (gN/m3)
      sP: 0.000167                                   #  P (gP/m3)
      sFRes: 0.426                                   #  reserve fraction of biomass (-)
      sDSiz: 0.03                                    #  average individual fish size (gDW/ind)
      fVul: 1.0                                      #  biomass fraction vulnerable to predation (-)
    parameters:
    # fish stage-structure parameters
      qStage: 2                                      #  stage coupling method: 0=nothing; 1=repro.; 2=maturation; 3=both (-)
      fResMax: 0.426                                 #  maximum reserve fraction of total biomass (-)
      fResMin: 0.167                                 #  minimum reserve fraction of total biomass (-)
      cMortStarv: 0.2                                #  starvation mortality proportionality constant (-)
      cDinit: 0.004                                  #  initial individual dry weight of stage (gDW)
      cDfin:  0.6                                    #  final individual dry weight of stage (gDW)
    # prey parameters                               
      qODB: 1                                        #  toggle optimal diet breadth: 0=off; 1=on (-)
      qOPT: 1                                        #  toggle optimal behavior: 0=off; 1=on (-)
      nBEN: 0                                        #  number of benthos prey (-)
      nPISC: 0                                       #  number of fish prey (-)
      nPLAN: 2                                       #  number of plankton prey (-)
      fFC: 0.7                                       #  feeding efficiency in refuge relative to arena (-)
      fPV: 0.95                                      #  predation vulnerability in refuge relative to arena (-)
      cClearPlan1: 0.29                              #  clearance rate for plankton prey 1 (m3/gDW/d)
      cClearPlan2: 0.3                               #  clearance rate for plankton prey 2 (m3/gDW/d)
      fGutOccPlan1: 1.0                              #  gut occupation factor for plankton prey 1 (-)
      fGutOccPlan2: 1.0                              #  gut occupation factor for plankton prey 2 (-)
    # fish vital parameters
      kDConsMax: 0.26                                #  standard dry weight specific maximum consumption rate (gDW/gDW/d)
      kDRespFi: 0.012                                #  maintenance respiration constant of fish at 20*C (1/d)
      fDAssFi: 0.8                                   #  C assimilation efficiency of fish (-), default = 0.4
      fDRespActFi: 1.                                #  additional feeding respiration as fraction of kDRespFi (-)
      kMortFi: 0.015                                 #  specific mortality of fish (1/d)
      lVegOpt: false                                 #  switch for macrophyte dependence on fish max assimilation (-)
      cRelVegPlan: 0.0                               #  decrease of fish plankton feeding per macrophytes cover; max. 0.01 (-)
      hDVegGrowth: 0.0                               #  lVegOpt = .true.; half-saturation macrophyte density for growth (g/m2)
    # stochiometric parameters
      lNutMeth: false                                #  toggle fixed stochiometry (-)
      fPBone: 0.5                                    #  fraction of fish P fixed in bones and scales (-)
      fDBone: 0.35                                   #  fraction of fish C fixed in bones and scales (-)
      fDissEgesFish: 0.25                            #  soluble inorg. nut. frac. of fish egested food (-)
      fDissMortFish: 0.1                             #  soluble inorg. nut. frac. of dead fish; excl. bones & scales (-)
      cNDFishRef: 0.1                                #  reference N/C ratio of fish (mgN/mgDW)
      cPDFishRef: 0.022                              #  reference P/C ratio of fish(mgP/mgDW)
      fFiDOMW: 0.75                                  #  dissolved organic matter fraction from fish(-)
    # fish temperature parameters
      cSigTmFish: 9.42                               #  temperature constant of fish; sigma in Gaussian curve(*C)
      cTmOptFish: 25.0                               #  optimal temperature of fish(*C)
    # boundary condition and variable constraint parameters
      cDFiMin: 1e-10                                 #  minimum DW density (gDW/m3)
      cDFiIn: 0.0                                    #  external density (gDW/m3)
      kMigrFish: 0.0005                              #  fish migration rate (1/d)
    # vertical movement parameters
      qTrans: 1                                      #  vert. trans. method: 0=no trans.; 1=passive; 2=O2; 3=O2 & Light (-)
    # diagnostic parameter
      diagnostics: true                              # turn on extra diagnostics
