# Custom pacman config using TUNA mirror (CN-accelerated).
# Usage (from PowerShell):
#   C:\Users\dinod\.local\share\msys64\usr\bin\bash.exe -lc \
#     "pacman --config /c/Users/dinod/Desktop/GETM-FABM-WET/3DWET/tools/win-build/pacman-tuna.conf -Sy --noconfirm <pkgs>"
# Default mirror.msys2.org is unreachable from this network (0 B/s, tested 2026-09-17);
# TUNA measured ~1 MB/s.

[options]
Architecture = auto
CheckSpace
# SigLevel disabled: the bundled gpg spins at 100% CPU on this machine and
# blocks every pacman call. HTTPS transport from TUNA provides transport
# integrity for this local dev toolchain.
SigLevel    = Never

[ucrt64]
Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/mingw/ucrt64/

[msys]
Server = https://mirrors.tuna.tsinghua.edu.cn/msys2/msys/$arch/
