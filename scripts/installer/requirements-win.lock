# Windows x64 wheels for the embedded CPython 3.12 runtime.
# Resolved from requirements.txt with numpy==1.26.4.
# pywebview 6.2.1 and its binary dependencies are included. proxy_tools has
# no upstream wheel; scripts/build_windows_installer.sh builds that one wheel
# and installs it with --no-deps. The shortcut runs pythonw.exe with no --web,
# so the window is WebView2. --web remains a debug flag.
# pyabc is omitted: it pulls pandas, matplotlib, scikit-learn, and Jupyter.
# Calibration already falls back to SciPy when pyabc is not installed.
# netCDF4 stays at 1.7.1.post2. 1.7.2 and later ship an HDF5 build that calls
# ucrtbase.feholdexcept, which Wine 9 cannot load. 1.7.1.post2 still matches
# requirements.txt (netCDF4>=1.6,<2) and imports on Windows and under Wine.
# Rebuild with: bash scripts/build_windows_installer.sh
