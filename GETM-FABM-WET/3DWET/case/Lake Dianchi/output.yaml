# 关键变量每天写入 output.nc；水质按周写入 ext_wq.nc。
# 水位 elev、深度积分流速 u/v 由原生 *.2d.nc 写出，不能放进这里。
# 周文件默认只写水质状态量（溶解氧、氨氮、硝氮、磷酸盐、有机碳氮磷、
# 藻类、浮游动物、鱼、DIC、甲烷等），外加三个藻类的叶绿素 oChla
# 和合计 wet_chla_calculator_result。
# 诊断量（反应速率、限制因子）默认不写。需要时把某一实例改回：
#   - source: fabm/<实例名>/*
#     output_level: 8
# 不能写 abiotic_water/*：FABM 登记在类别 fabm/<实例名>，那个写法是空的。
# 不要再用 source: * —— 那会把每个诊断量都按天写出。
allow_missing_fields: true
output:
   time_unit: second
   time_step: 86400
   sync_interval: 1
   variables:
      - source: temp
      - source: D
      - source: hn
      - source: z
      - source: abiotic_water_sO2W
ext_wq:
   time_unit: day
   time_step: 7
   sync_interval: 1
   variables:
      - source: abiotic_water_sNH4W
      - source: abiotic_water_sNO3W
